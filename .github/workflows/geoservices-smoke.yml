# Checks the public FeatureServer end to end (scripts/smoke_geoservices.py) every night, so a
# change in the server, the catalog, the load balancer or the CDN shows up within a day.
name: FeatureServer smoke

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.smoke_geoservices
