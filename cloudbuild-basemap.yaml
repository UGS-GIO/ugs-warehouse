# Offline basemap build + publish: OpenStreetMap → Planetiler (OpenMapTiles schema) → the whole
# state in one archive (utah.pmtiles, ~180 MB), plus a low-zoom overview and one archive per
# 7.5-minute quad for smaller partial saves → the CDN under basemap/.
#
#   gcloud builds submit --config cloudbuild-basemap.yaml --project ut-dnr-ugs-backend-tools \
#     --service-account projects/ut-dnr-ugs-backend-tools/serviceAccounts/<compute-SA> .
#
# Runs as the same Compute SA as cloudbuild.yaml / cloudbuild-docs.yaml, which already has
# objectAdmin on the public bucket, so no extra grants. Nothing in the viewer changes until
# basemap/index.json exists: the "Save basemap" button stays hidden until then.
#
# Re-running replaces every archive with a fresh OSM extract. Monthly is plenty for a basemap.
substitutions:
  _PUBLIC_BUCKET: ut-dnr-ugs-maps-prod-public
  _BASEMAP_PREFIX: basemap
  _PMTILES_VERSION: 1.28.2

steps:
  # Planetiler needs Java 21 and the cut needs the pmtiles CLI; the script itself is stdlib Python,
  # so PYTHONPATH=src is all it needs (no package install, none of the ingest dependencies).
  - id: build-basemap
    name: eclipse-temurin:21-jdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq python3 curl > /dev/null
        curl -sSL "https://github.com/protomaps/go-pmtiles/releases/download/v${_PMTILES_VERSION}/go-pmtiles_${_PMTILES_VERSION}_Linux_x86_64.tar.gz" \
          | tar -xz -C /usr/local/bin pmtiles
        PYTHONPATH=src python3 -m scripts.build_basemap --work /workspace/basemap-work --out /workspace/basemap

  # Publish, in an order that never leaves the CDN inconsistent. First refuse an incomplete build:
  # the quad sync deletes what the build no longer produced, so a short build would wipe the live
  # basemap. Then the archives, and index.json LAST with no-cache from its first byte — the viewer
  # prices downloads from it, and uploading it with the archives' daily header (even briefly) lets
  # a CDN edge pin a stale index for a day. Archives revalidate daily: a rebuild reuses their names.
  # ($$ escapes a literal $ from Cloud Build's own substitution.)
  - id: publish-basemap
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        out=/workspace/basemap
        dest=gs://${_PUBLIC_BUCKET}/${_BASEMAP_PREFIX}
        for f in utah.pmtiles overview.pmtiles index.json; do
          [[ -s "$$out/$$f" ]] || { echo "missing or empty: $$f; not publishing" >&2; exit 1; }
        done
        n=$$(find "$$out/quads" -name '*.pmtiles' | wc -l)
        listed=$$(python3 -c "import json; print(len(json.load(open('$$out/index.json'))['quads']))")
        # The grid is fixed at 1,512 quads; anything well short of it is a broken build.
        if (( n < 1500 || n != listed )); then
          echo "built $$n quads, index lists $$listed; expected ~1,512 of each. Not publishing." >&2
          exit 1
        fi
        cache="public, max-age=86400"
        gcloud storage rsync "$$out/quads" "$$dest/quads" --recursive \
          --delete-unmatched-destination-objects --cache-control="$$cache"
        gcloud storage cp "$$out/utah.pmtiles" "$$out/overview.pmtiles" "$$dest/" --cache-control="$$cache"
        gcloud storage cp "$$out/index.json" "$$dest/index.json" \
          --cache-control="no-cache" --content-type="application/json"

# Planetiler runs with a 4 GB heap and the cut runs eight extracts at once; the default machine
# is too small for both. About 3 minutes end to end; ~470 MB published (183 MB statewide file,
# 289 MB of overview + quads).
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
