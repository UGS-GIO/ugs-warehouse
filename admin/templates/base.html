<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Warehouse Ops{% endblock %} · UGS</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    document.addEventListener('htmx:configRequest', function (e) {
      e.detail.headers['X-CSRFToken'] = document.querySelector('meta[name=csrf-token]').content;
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-slate-800 text-white px-5 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <a href="{% url 'ops:dashboard' %}" class="font-semibold hover:text-slate-200">UGS Warehouse · Ops Console</a>
      <nav class="flex gap-4 text-sm font-medium text-slate-300">
        <a href="{% url 'ops:dashboard' %}" class="hover:text-white transition">Operations</a>
        <a href="{% url 'ops:publications' %}" class="hover:text-white transition">Harvest Registry</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-xs text-slate-300">
      <button id="tzbtn" onclick="toggleTz()" title="Toggle timezone (Local / UTC)"
              class="rounded border border-slate-600 px-2 py-0.5 hover:bg-slate-700">Local</button>
      <span>{{ iap_email|default:"—" }}{% if dry_run %} · <span class="text-amber-300 font-medium">DRY-RUN</span>{% endif %}</span>
    </div>
  </header>
  <main class="max-w-[1700px] mx-auto px-5 sm:px-8 py-6">{% block content %}{% endblock %}</main>

  {# Shared log viewer — a big terminal modal. Buttons hx-get a log partial into #logmodal-body. #}
  <div id="logmodal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" onclick="closeLogModal()"></div>
    <div class="relative w-full max-w-6xl h-[80vh] bg-slate-900 rounded-lg shadow-2xl flex flex-col overflow-hidden ring-1 ring-slate-700">
      <button class="absolute top-2 right-3 z-10 text-slate-400 hover:text-white text-xl leading-none" onclick="closeLogModal()">✕</button>
      <div id="logmodal-body" class="flex-1 min-h-0 flex flex-col"></div>
    </div>
  </div>
  <script>
    function openLogModal() { document.getElementById('logmodal').classList.remove('hidden'); }
    function closeLogModal() {
      document.getElementById('logmodal').classList.add('hidden');
      document.getElementById('logmodal-body').innerHTML = '';  // stop any auto-poll inside
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLogModal(); });

    // Timestamps: server sends UTC ISO in <time data-ts>; render in the viewer's local zone or UTC.
    // "Local" = the browser's own timezone (whatever you're in); UTC always one click away.
    function tzMode() { return localStorage.getItem('tzmode') || 'local'; }
    function fmtTimes() {
      const utc = tzMode() === 'utc';
      const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
                     hour12: false, timeZoneName: 'short' };
      if (utc) opts.timeZone = 'UTC';
      document.querySelectorAll('time[data-ts]').forEach(el => {
        const iso = el.getAttribute('data-ts');
        if (!iso) { el.textContent = ''; return; }
        const d = new Date(iso);
        el.textContent = d.toLocaleString('en-US', opts);
        el.title = d.toISOString();  // raw UTC always on hover
      });
      const btn = document.getElementById('tzbtn');
      if (btn) btn.textContent = utc ? 'UTC' : 'Local';
    }
    function toggleTz() { localStorage.setItem('tzmode', tzMode() === 'utc' ? 'local' : 'utc'); fmtTimes(); }
    document.addEventListener('DOMContentLoaded', fmtTimes);
    document.body.addEventListener('htmx:afterSwap', fmtTimes);  // re-format after status polls swap
  </script>
</body>
</html>
