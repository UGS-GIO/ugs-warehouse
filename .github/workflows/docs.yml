name: Deploy Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'cloudbuild-docs.yaml'

# Docs-only fast deploy: submit cloudbuild-docs.yaml (MkDocs build + rsync, NO image builds) and
# wait for it (sync) so this run reflects the real deploy result. Mirrors viewer.yml.
jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/534590904912/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'warehouse-deployer@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build + deploy docs via Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild-docs.yaml . \
            --project=ut-dnr-ugs-backend-tools
