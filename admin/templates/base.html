<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Warehouse Ops{% endblock %} · UGS</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    document.addEventListener('htmx:configRequest', function (e) {
      e.detail.headers['X-CSRFToken'] = document.querySelector('meta[name=csrf-token]').content;
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-slate-800 text-white px-5 py-3 flex items-center justify-between">
    <div class="font-semibold">UGS Warehouse · Ops Console</div>
    <div class="text-xs text-slate-300">
      {{ iap_email|default:"—" }}{% if dry_run %} · <span class="text-amber-300 font-medium">DRY-RUN</span>{% endif %}
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-5 py-6">{% block content %}{% endblock %}</main>
</body>
</html>
