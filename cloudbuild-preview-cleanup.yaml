# Tear down a PR's previews. Trigger: pull request closed (merged or not).
#
# This is the PRIMARY cleanup, not a nicety. The bucket lifecycle is a 30-day backstop, deliberately
# longer than a PR's life: a shorter age would delete the preview of a PR that is merely sitting
# open, and the reviewer would get a 404 with no explanation. Closing the PR is the real signal.
substitutions:
  _REGION: us-central1
  _PREVIEWS_BUCKET: ut-dnr-ugs-maps-prod-previews
  _PREVIEW_PATH: viewer/pr-

steps:
  - id: drop-viewer-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # Not `set -e`: a PR that never built a preview has nothing to delete, which is not a
        # failure.
        gcloud storage rm --recursive \
          "gs://${_PREVIEWS_BUCKET}/${_PREVIEW_PATH}$_PR_NUMBER" || \
          echo "no viewer preview for PR $_PR_NUMBER"

options:
  logging: CLOUD_LOGGING_ONLY
