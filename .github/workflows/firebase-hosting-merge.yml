# Publish the viewer to the live Firebase Hosting site on every push to main that touches it. main
# only takes merges from develop (or an admin hotfix), so each push is a release.
name: Viewer deploy

on:
  push:
    branches: [main]
    paths: ["viewer/**", "firebase.json"]

# Repo default is read-only GITHUB_TOKEN (org policy). action-hosting-deploy needs checks: write to
# post the deploy status as a check run on the commit.
permissions:
  contents: read
  checks: write

jobs:
  deploy:
    uses: ./.github/workflows/viewer-deploy.yml
    with:
      site: data-geology-utah-gov
      features_base: ${{ vars.VITE_FEATURES_BASE }}
      tiles_base: ${{ vars.VITE_TILES_BASE }}
    secrets: inherit
