# Per-PR preview of the viewer, on a Firebase Hosting preview channel — a PUBLIC, no-login URL,
# which is the payoff #187 is after. It replaces the IAP-gated Cloud Run preview
# (cloudbuild-viewer-preview.yaml) that a reviewer had to hold a session for.
#
# Why an Action and not Cloud Build, when CI lives in Cloud Build: the deploy needs Firebase
# credentials. Cloud Build's SA would need project-level roles/firebasehosting.admin (there is no
# per-site or channels-only role), and the preview build identity is deliberately scoped to the
# previews bucket and nothing else — infra/iam.tf §previews. An Action with the same
# FIREBASE_SERVICE_ACCOUNT_* secret ugs-map-viewer uses keeps that boundary where it is.
#
# Same-repo PRs only: a fork PR must never see the service-account secret.
name: Viewer preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["viewer/**", "firebase.json"]

# Repo default is read-only GITHUB_TOKEN (org policy). action-hosting-deploy needs checks: write to
# post the deploy status as a check run; pull-requests: write is for the preview comment, which this
# workflow now upserts itself (the action runs with disableComment).
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      # Both are optional: the viewer hides the OGC/tiles links when they're empty rather than
      # printing dead URLs. Set them as repo variables to give previews the real endpoints.
      - name: Build
        working-directory: viewer
        env:
          VITE_FEATURES_BASE: ${{ vars.VITE_FEATURES_BASE }}
          VITE_TILES_BASE: ${{ vars.VITE_TILES_BASE }}
        run: |
          npm ci
          npm run build

      # channelId is never `live`, so this cannot overwrite the site. The action posts (and updates)
      # the preview URL as a PR comment itself — no separate comment workflow to keep in sync.
      # disableComment: this workflow posts ONE comment carrying both previews. A viewer PR always
      # produces two — the public one here and the IAP review one from cloudbuild-viewer-preview.yaml
      # — and two bot comments per push is noise. They cannot be reduced to one BUILD: the review
      # flavour is the same tree built against the review catalog, and IS_REVIEW branches inside
      # shared files (item-detail, browse, app, stac, …), so a path filter would hide review
      # regressions on exactly the PRs that cause them.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD }}
          projectId: ut-dnr-ugs-maps-prod
          channelId: pr-${{ github.event.number }}
          expires: 7d
          disableComment: true
          firebaseToolsVersion: "13.29.1"

      # The review preview's URL is deterministic (<previews host>/viewer/pr-<n>/), so it can be
      # named here rather than waited on; its Cloud Build check is what says when it is live.
      - name: Upsert the preview comment
        uses: actions/github-script@v7
        env:
          PUBLIC_URL: ${{ steps.firebase.outputs.details_url }}
        with:
          script: |
            const n = context.payload.pull_request.number;
            const marker = "<!-- ugs-warehouse-preview -->";
            const review = `https://ugs-warehouse-previews-ufyuidl4mq-uc.a.run.app/viewer/pr-${n}/`;
            const body = [
              marker,
              `🌎 **Preview** (public, no login): ${process.env.PUBLIC_URL}`,
              `🔒 **Review viewer** (IAP, review catalog): ${review}`,
              "",
              "<sub>Same tree, two builds — the review one is what exercises comments and diffs. "
                + "It appears once `ugs-warehouse-viewer-preview` goes green.</sub>",
            ].join("\n");
            const { data } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: n, per_page: 100,
            });
            const mine = data.find((c) => c.body.includes(marker));
            const args = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (mine) await github.rest.issues.updateComment({ ...args, comment_id: mine.id });
            else await github.rest.issues.createComment({ ...args, issue_number: n });
