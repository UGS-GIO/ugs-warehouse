# Publish the viewer to the live Firebase Hosting site on every push to main that touches it.
#
# Deploy lives here rather than in cloudbuild.yaml for the reason in
# firebase-hosting-pull-request.yml: Cloud Build has no Firebase credentials, and granting its SA
# project-level roles/firebasehosting.admin is the only way it could get them. Cloud Build still
# owns everything else — images, Cloud Run, the review viewer bundle.
name: Viewer deploy

on:
  push:
    branches: [main]
    paths: ["viewer/**", "firebase.json"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build
        working-directory: viewer
        env:
          VITE_FEATURES_BASE: ${{ vars.VITE_FEATURES_BASE }}
          VITE_TILES_BASE: ${{ vars.VITE_TILES_BASE }}
        run: |
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD }}
          projectId: ut-dnr-ugs-maps-prod
          channelId: live
          firebaseToolsVersion: "13.29.1"
