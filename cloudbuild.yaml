# Build the warehouse images, push to Artifact Registry, deploy the Cloud Run services.
#
# Trigger options (pick one):
#   - Cloud Build GitHub trigger on push to main (simplest), or
#   - GH Actions (Workload Identity Federation, keyless) -> `gcloud builds submit`, or
#   - manual `gcloud builds submit --config cloudbuild.yaml`.
#
# Fill the _SUBSTITUTIONS below for your project (or pass --substitutions=...).
# The Cloud Build service account needs: artifactregistry.writer, run.developer,
# and iam.serviceAccountUser ON the runtime SA (_RUNTIME_SA).

substitutions:
  _REGION: us-central1
  _AR_REPO: ugs-warehouse                 # Artifact Registry docker repo name
  _RUNTIME_SA: warehouse-run@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com                         # runtime SA email — storage.objectAdmin + cloudsql.client + secretAccessor
  _SQL_INSTANCE: ut-dnr-ugs-mappingdb-prod:us-west3:mapping-db
  _SECRET: dbt-prod-db-password           # Secret Manager secret holding the DB password
  _DATA_PATH: gs://ut-dnr-ugs-maps-prod-public/warehouse/ducklake/
  _JOB: ugs-warehouse-ingest              # Cloud Run job (batch --all reingest). Distinct resource from the Pub/Sub topic of the same name below.
  _PUBS_JOB: ugs-pubs-ingest              # Cloud Run job: rebuild the ugs-publications STAC collection from pub metadata (no COG re-harvest)
  _RESTYLE_JOB: ugs-warehouse-restyle     # Cloud Run job: rebind ugs-styles renders into STAC items (no reingest) — ugs-styles publish CI triggers it
  _API_SERVICE: ugs-warehouse-api
  _FEATURES_SERVICE: ugs-warehouse-features   # OGC API Features for Arc Pro (duckdb_featureserv over GeoParquet, scale-to-zero)
  _SERVICE: ugs-warehouse-service
  # Ops console (Django + HTMX, behind IAP) — triggers the jobs above + shows catalog coverage.
  _ADMIN_SERVICE: ugs-warehouse-admin
  _ADMIN_SA: warehouse-admin-run@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com  # runtime SA — run.developer (trigger/status) + logging.viewer (live + per-pub logs) + storage.objectViewer on the COG bucket (registry harvest status)
  _ADMIN_HOSTS: .run.app                                                           # ALLOWED_HOSTS; add the LB/custom domain once IAP is fronted
  _ADMIN_SECRET: warehouse-admin-secret-key                                        # Secret Manager secret — stable Django SECRET_KEY across workers/instances
  # Pub/Sub ingest trigger (dataELT #418 publishes `{schema, topic}` to _INGEST_TOPIC).
  _INGEST_TOPIC: ugs-warehouse-ingest     # topic dataELT publish.sh targets — name is the contract, do not rename
  _INGEST_SUB: ugs-warehouse-ingest-push  # push subscription -> the service `/` endpoint
  # public OGC api connects read-only — never schema_owner (role + secret provisioned by Marshall)
  _API_DB_USER: schema_reader
  _API_SECRET: schema-reader-db-password
  # Static STAC viewer → public bucket → CDN (https://maps-assets.geology.utah.gov/warehouse/viewer/)
  _PUBLIC_BUCKET: ut-dnr-ugs-maps-prod-public
  _VIEWER_PREFIX: warehouse/viewer
  # Tag used for images (defaults to SHORT_SHA in automated triggers)
  _TAG: $SHORT_SHA

steps:
  # Build Warehouse
  # Layer cache: pull the prior :latest + --cache-from (inline cache) so unchanged apt/pip-deps
  # layers are reused — only the app layer rebuilds on a code change. tippecanoe is COPY'd from
  # the prebuilt base (no compile).
  - id: build-warehouse
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse
        TIP=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-tippecanoe:latest
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg TIPPECANOE_IMAGE="$$TIP" \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .
  
  # Build API
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:latest
      - api/
    env:
      - DOCKER_BUILDKIT=1

  # Build Harvest
  - id: build-harvest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest
        TIP=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-tippecanoe:latest
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build -f Dockerfile.harvest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg TIPPECANOE_IMAGE="$$TIP" \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  # OGC API Features for Arc Pro — duckdb_featureserv over GeoParquet (DuckDB views on the CDN
  # parquet). Builds a tiny DuckDB file from the STAC catalog at image-build time (needs network).
  - id: build-features
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:latest
      - featureserv/

  # Ops console (Django + HTMX). Build context is the repo root (Dockerfile.admin COPYs admin/).
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build -f Dockerfile.admin \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  - id: push-warehouse
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse']

  - id: push-admin
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin']

  - id: push-features
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features']

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api']

  - id: push-harvest
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest']

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # custom delimiter (^@^) so gs:// values with no commas stay safe
      - --set-env-vars=^@^SOURCE_BACKEND=postgres@CLOUDSQL_INSTANCE=${_SQL_INSTANCE}@DB_NAME=seamlessgeolmap@DB_USER=schema_owner@DUCKLAKE_DATA_PATH=${_DATA_PATH}@DUCKDB_MAX_MEMORY=1.5GB
      - --command=scripts/cloudrun_entrypoint.sh
      - --args=--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=2Gi

  - id: deploy-harvest-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - geolmap-harvest
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_SECRET}:latest
      - --set-env-vars=^|^SOURCE_BACKEND=postgres|POSTGRES_DSN=host=/cloudsql/${_SQL_INSTANCE} dbname=seamlessgeolmap user=schema_owner|DUCKLAKE_DATA_PATH=${_DATA_PATH}|MAX_ZIP_SIZE_MB=500
      - --command=python
      - --args=-m,ugs_warehouse.pubs.harvest,--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=4Gi

  # Pubs metadata → STAC rebuild. Decoupled from the COG harvest above: this only re-reads
  # pub metadata (vendored CSV snapshot today; PUBS_DB_URL later) + lists GCS for harvested
  # artifacts, then rewrites the ugs-publications items + refresh_catalog. NO GDAL, NO COG
  # re-harvest. Uses the harvest image (it carries the `pubs` extra / geopandas that
  # footprints.geoms needs). No Cloud SQL / DB secret — source is the CSV + GCS.
  # Run after a metadata edit: `gcloud run jobs execute ${_PUBS_JOB} --region=${_REGION}`.
  - id: deploy-pubs-ingest-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_PUBS_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --command=python
      - --args=-m,ugs_warehouse.pubs.ingest
      - --task-timeout=1800
      - --max-retries=1
      - --cpu=1
      - --memory=2Gi

  # Rebind ugs-styles renders into STAC items (no reingest). The ugs-styles publish CI executes
  # this after pushing the styles CDN. Deployed here so it tracks the CURRENT warehouse image —
  # else its render-block logic (e.g. legend passthrough) goes stale. Uses the warehouse image
  # (core only; no geopandas), no Cloud SQL / DB (reads GCS + the styles manifest, rewrites item.json).
  - id: deploy-restyle-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_RESTYLE_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --command=python
      - --args=-m,ugs_warehouse.restyle
      - --task-timeout=1800
      - --max-retries=1
      - --cpu=1
      - --memory=2Gi

  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_SECRET}:latest
      - --set-env-vars=^|^SOURCE_BACKEND=postgres|POSTGRES_DSN=host=/cloudsql/${_SQL_INSTANCE} dbname=seamlessgeolmap user=schema_owner|DUCKLAKE_DATA_PATH=${_DATA_PATH}
      # ingest runs synchronously inside the push handler — give it room past the 300s default
      - --timeout=3600

  # Ops console — gated by direct Cloud Run IAP (--iap, no load balancer). Grant users the
  # iap.httpsResourceAccessor role on the service out-of-band. The runtime SA (_ADMIN_SA) also needs
  # logging.viewer (live + per-pub logs) and storage.objectViewer on the COG bucket (registry).
  - id: deploy-admin
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ADMIN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin:${_TAG}
      - --region=${_REGION}
      - --service-account=${_ADMIN_SA}
      - --ingress=all
      - --iap
      - --no-allow-unauthenticated
      - --set-secrets=SECRET_KEY=${_ADMIN_SECRET}:latest
      - --set-env-vars=^|^DEBUG=False|JOBS_DRY_RUN=False|ALLOWED_HOSTS=${_ADMIN_HOSTS}|GCP_PROJECT=$PROJECT_ID|GCP_REGION=${_REGION}

  # Wire the Pub/Sub push trigger: topic -> private service. Idempotent (safe to
  # re-run every build). allowFailure until the build SA has pubsub.admin + the
  # Pub/Sub service agent has tokenCreator on the push SA — then it self-provisions.
  - id: wire-pubsub
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        set -euo pipefail
        gcloud pubsub topics create ${_INGEST_TOPIC} --project=$PROJECT_ID || true
        URL=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)')
        # let the push SA invoke the private service
        gcloud run services add-iam-policy-binding ${_SERVICE} --region=${_REGION} \
          --member="serviceAccount:${_RUNTIME_SA}" --role=roles/run.invoker
        # create-or-update the push subscription
        if gcloud pubsub subscriptions describe ${_INGEST_SUB} >/dev/null 2>&1; then
          gcloud pubsub subscriptions update ${_INGEST_SUB} \
            --push-endpoint="$$URL/" --push-auth-service-account=${_RUNTIME_SA}
        else
          gcloud pubsub subscriptions create ${_INGEST_SUB} \
            --topic=${_INGEST_TOPIC} --push-endpoint="$$URL/" \
            --push-auth-service-account=${_RUNTIME_SA} \
            --ack-deadline=600 --message-retention-duration=1d
        fi

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^DATABASE_URL=postgresql://${_API_DB_USER}@/seamlessgeolmap?host=/cloudsql/${_SQL_INSTANCE}|PGFS_DATABASE_DBCONNECTION=postgresql://${_API_DB_USER}@/seamlessgeolmap?host=/cloudsql/${_SQL_INSTANCE}
      - --allow-unauthenticated

  # OGC API Features (Arc Pro) — scale-to-zero, no Cloud SQL / secrets (reads public CDN parquet).
  - id: deploy-features
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FEATURES_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=9000
      - --cpu=1
      - --memory=512Mi
      - --timeout=120

  # Resolve the deployed OGC API Features URL → file, so the viewer can bake it as
  # VITE_FEATURES_BASE (the "OGC API" link). Runs after deploy-features (serial order); empty
  # file if the service isn't up → the viewer link stays hidden (no dead link).
  - id: resolve-features-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_FEATURES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/features_url 2>/dev/null \
          || printf '' > /workspace/features_url
        echo "VITE_FEATURES_BASE=$$(cat /workspace/features_url)"

  # Build the static STAC viewer (Vite, base "./" so it works under any CDN subpath).
  - id: build-viewer
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        cd viewer
        npm ci
        npm run build

  # Publish viewer/dist → public bucket → CDN. Idempotent rsync; index.html revalidates
  # (hashed assets are immutable). allowFailure until the build SA has objectAdmin on the
  # bucket (grant in docs/DEPLOY.md §5).
  - id: deploy-viewer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        gcloud storage rsync viewer/dist gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX} \
          --recursive --delete-unmatched-destination-objects
        gcloud storage objects update gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX}/index.html \
          --cache-control="no-cache"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest

options:
  logging: CLOUD_LOGGING_ONLY
