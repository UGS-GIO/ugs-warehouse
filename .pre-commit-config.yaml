# Local gate so broken YAML / workflows / Python never get committed (and re-deploy-loop).
# Setup once per clone:  pip install pre-commit && pre-commit install
# Run on everything:     pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml          # every .yaml/.yml must parse (catches the deploy.yml indent break)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint          # GitHub Actions-aware lint: indentation, keys, expressions, shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0              # keep in lockstep with `ruff==` in pyproject [dev]
    hooks:
      - id: ruff                # Python lint (the project linter)

  - repo: local
    hooks:
      - id: row-identity-doc-sync   # docs/IDENTITY.md must stay in sync with the identity machinery
        name: row-identity doc-sync (governance §10.2)
        entry: python3 scripts/check_identity_doc_sync.py   # python3, not python — macOS has no `python` shim
        language: system
        pass_filenames: false       # whole-repo check, not per-file
        always_run: true
