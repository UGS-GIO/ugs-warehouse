# Server config for duckdb_featureserv. Baked into the image at /config/ (upstream searches
# ./config, /config, /etc). Without this file the server runs on upstream's built-in viper
# defaults, and two of those are wrong for us.
#
# Only the keys we deliberately override live here — viper merges over its defaults, so every
# key left out keeps upstream's value (assets path, timeouts, CORS "*", etc.).

[Server]
# Upstream default is 30s, and it is a hard cut: the server abandons the response mid-write and the
# client gets a 200 with a truncated (often empty) body, no error. The first /collections on a cold
# container measures ~20s -- it resolves an extent per collection against remote parquet, and that
# is the one request that can approach the limit. 120s matches Cloud Run's own --timeout on this
# service, so the platform stays the real bound rather than the server silently cutting first.
# Extents are cached for the process life after that call (~0.03s), so this affects one request
# per container. Precomputing extents in gen_db is the way to remove the cost rather than raise
# the ceiling.
WriteTimeoutSec = 120

# Whitelist for the `transform=` query parameter. Upstream populates this list ONLY from config,
# so with no file every transform value 400s — the feature is off by default rather than open by
# default. Server-side geometry reduction matters here because collections are views over remote
# GeoParquet: `transform=ST_Simplify,0.001` on an 85k-polygon layer is the difference between a
# usable Arc Pro / QGIS connection and a 65MB download.
#
# ST_Simplify and ST_Buffer take a required argument (`transform=ST_Simplify,0.001`). Calling
# either bare returns a 500, not a 400 — an upstream wart, not something this file can fix.
TransformFunctions = [
    "ST_Centroid",
    "ST_Envelope",
    "ST_PointOnSurface",
    "ST_Boundary",
    "ST_ConvexHull",
    "ST_Simplify",
    "ST_Buffer",
]

[Paging]
# Upstream defaults are LimitDefault=10 / LimitMax=1000, and LimitMax was the damaging one: it
# truncated every response at 1000 features with no way for the client to notice. 10 of 27 serving
# topics are over 1000; enmin_plss_sections is 84,756, so 98.8% of it was being dropped silently.
# Truncation is now at least *visible* — numberMatched and rel="next" ship with the patched server.
#
# The ceiling on LimitMax is memory, not policy: featureserv buffers the whole FeatureCollection
# before writing it, so peak memory tracks the largest single response. Keep this value and the
# service's --memory in cloudbuild.yaml in step; they are one decision recorded in two files.
#
# Measured against the deployed image, full 84,756-feature pull (122MB response):
#   512Mi  OOM — and this was the deployed size, so a client paging a large collection got a 503
#                mid-walk and killed the container, taking concurrent requests with it (ALL-5410)
#   1Gi    OOM on a single full pull; survives paged 20k requests
#   2Gi    survives repeated full pulls (11.5s cold, ~3s warm), no OOM
#
# LimitMax keeps one response small (~15MB on the largest layer at 10000); clients page past it
# with the `next` link.
#
# LimitDefault=1000 is a separate judgement call: a bare /items with no params on the largest layer
# costs ~1.45MB instead of 10 features. Real clients (Arc Pro, QGIS) always send an explicit limit
# and the HTML UI pages its own view, so this lands on naive curl/browser hits only.
LimitDefault = 1000
LimitMax = 10000

[Metadata]
# Surfaced as the service title/description on `/` and in the generated OpenAPI at `/api` — this
# is a public endpoint that federation catalogs and Arc Pro's server browser read by name.
# Upstream's defaults are the generic "duckdb_featureserv" / "DuckDB Feature Server with Spatial
# Extension", which say nothing about whose data this is.
Title = "Utah Geological Survey — OGC API Features"
Description = "OGC API - Features over the UGS geospatial warehouse. Collections are served live from GeoParquet on the public CDN. For standards clients (ArcGIS Pro, QGIS, federation); UGS web maps use PMTiles."

[Website]
# The HTML map's basemap tiles. Upstream's default is an empty string, and empty is not "no
# basemap" -- the template feeds it straight into `new ol.source.OSM({url: BASEMAP_URL})`, which
# breaks OpenLayers' render loop. That matters beyond cosmetics: the vector layer uses the default
# `all` loading strategy, whose loader is driven by that render loop, so with no basemap the
# features are never fetched at all. `getExtent()` then returns nulls, the `rendercomplete`
# auto-zoom fits nothing, and the view sits at its initial center [0,0] -- a blank white page and
# "Feature count: -" on a collection that serves fine over JSON.
#
# Verified on prod: swapping this one URL in at runtime took enmin_plss_sections from 0 features
# rendered to 1000, and the auto-zoom snapped to Utah. OSM's tile server sends CORS headers, which
# is why upstream's own example config recommends it.
BasemapUrl = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
