# Tear down a PR's previews. Trigger: pull request closed (merged or not).
#
# Belt and braces, on purpose. The bucket prefix also has a lifecycle rule, so a preview from a
# build that never reached this step still expires; this just reclaims it the same day. The Cloud
# Run tag has no such backstop short of the per-service cap, so THIS step is the policy for tags.
substitutions:
  _REGION: us-central1
  _REVIEW_BUCKET: ut-dnr-ugs-maps-prod-review
  _PREVIEW_PREFIX: review/viewer/pr-
  _SERVICES: ugs-warehouse-tiles          # space-separated when more services gain previews

steps:
  - id: drop-viewer-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        # Not `set -e`: a PR that never built a preview has nothing to delete, which is not a
        # failure. Same for a tag that was never created below.
        gcloud storage rm --recursive \
          "gs://${_REVIEW_BUCKET}/${_PREVIEW_PREFIX}$_PR_NUMBER" || \
          echo "no viewer preview for PR $_PR_NUMBER"

  - id: untag-service-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        for svc in ${_SERVICES}; do
          gcloud run services update-traffic "$$svc" --region=${_REGION} \
            --remove-tags="pr-$_PR_NUMBER" || echo "no tag pr-$_PR_NUMBER on $$svc"
        done

options:
  logging: CLOUD_LOGGING_ONLY
