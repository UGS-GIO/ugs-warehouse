# pg_featureserv configuration
# Database connection URL is provided via environment variable DATABASE_URL
# which the binary picks up automatically.

[Server]
HttpPort = 8080
HttpHost = "0.0.0.0"

[Database]
# The database connection is handled via PGF_DATABASE_URL env var
# This will be injected by Cloud Run

[Catalog]
# Enable all schemas you want to expose.
# We'll use a dynamic approach to expose all tables.
# You can restrict this if needed for production.
# The 7 mart schemas the warehouse serves (matches vector/topics.py MART_SCHEMAS).
schemas = ["hazards", "emp", "gengis", "wetlands", "mapping", "geochron", "boreholes"]
