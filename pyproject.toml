[project]
name = "ugs-warehouse"
version = "0.0.1"
description = "DuckLake lakehouse for UGS — forks at _current and emits DuckLake + GeoParquet + PMTiles + STAC"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5.3,<2",  # cap lifted: h3 community ext dropped (was the only thing pinning to <1.5.4).
  "cloud-sql-python-connector>=1.11",
  "obstore>=0.10",       # unified S3/GCS/Azure object client (Rust); GCS sinks
  "google-cloud-run>=0.10",  # service/main.py starts the ingest job instead of ingesting in-request
  "google-cloud-storage>=2.18",  # core/gcs.py copy_from_uri only — server-side rewrite for
                                 # cross-bucket copies (obstore's copy() is single-store only).
  "fsspec>=2024.6",      # obstore fsspec adapter -> DuckLake GCS IO (no httpfs/HMAC)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.29",       # review-comments CRUD (serve.py) → review.comments in mapping-db (review_writer)
  "google-auth>=2.40",   # verifies IAP JWTs (iap.py) and Firebase ID tokens (comments.py)
  "requests>=2.31",      # iap.py fetches the signing keys with it
  "cryptography>=42",   # ...which are ES256, and google-auth only verifies EC keys with it
  "CacheControl>=0.14",  # caches the signing keys (iap.py)
  "pytz>=2024.1",        # DuckDB timestamptz -> Python conversion
  "rustac>=0.9",         # writes the stac-geoparquet item mirror (core/item_mirror.py); no deps
  # NB: no pyarrow / shapely — the vector ingest streams Postgres→DuckDB→CDN entirely in DuckDB
  # (no Python materialization). They live in the [pubs] extra (geopandas/pyogrio need them).
]

[project.optional-dependencies]
# ruff pinned (not `>=`): the version is the single source of truth for what CI
# and pre-commit enforce; an unpinned floor let a fresh install drift to a newer
# ruff and turn CI red. Keep this in lockstep with the ruff-pre-commit `rev` in
# .pre-commit-config.yaml (bump both together, e.g. via Renovate).
# httpx: starlette's TestClient is built on it — needed by tests/test_tiles_esri.py, which is the
# only automated check that sees the tiles service's Esri path contract.
# rashid: the Portolan validator, run by tests/test_portolan_conformance.py against a catalog the
# real builders write. It pulls the raster stack (rasterio, pyarrow, pyproj), which the base
# install deliberately avoids — the cost is ~400MB in CI and nothing in the runtime images. The
# test skips when it is absent, so a lean local env still runs the rest of the suite.
# geopandas/shapely: without them, test_pubs_vectors.py importorskips the GeoParquet writer away.
# rio-stac: test_stac_validation.py reads a real COG's asset fields with it (rashid brings rasterio).
# geoparquet-io: test_archive_gpio.py runs `gpio check` on the archive writer's output. It pins
# duckdb below 1.6, so CI tests a 1.5 duckdb until gpio moves.
dev = ["pytest>=8", "ruff==0.16.0", "pre-commit>=3.7", "pystac[validation]>=1.11", "httpx>=0.27",
       "rashid>=0.1.8", "geopandas>=1.0", "shapely>=2.0", "rio-stac>=0.12", "geoparquet-io>=1.6"]
# pubs/COG producer — heavy raster deps; installed in Dockerfile.harvest (needs system
# GDAL CLI + poppler too). duckdb is in the base deps.
pubs = [
  "rasterio>=1.3",
  "rio-cogeo>=5",
  "rio-stac>=0.12",      # COG asset bands/projection from the header — pubs/sink_stac.py
  "pmtiles>=3.8",        # writes the raster mosaic archives — pubs/geolmap_mosaics.py
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "pyarrow>=17",         # geopandas parquet IO (base ingest no longer needs it)
  "shapely>=2.0",        # geopandas geometry
  "pygltflib>=1.16",     # 3D fence glTF export — pubs/threed.py
  "mapbox-earcut>=1.0",  # polygon triangulation for the glTF mesh — pubs/threed.py
  "requests>=2.31",
  "pymysql>=1.1",        # optional: live pub metadata from MySQL (else vendored CSV snapshot)
  "fastembed>=0.3",      # semantic-search embeddings (bge-small via ONNX, no torch) — pubs/embed.py
  "geoparquet-io>=1.6",  # GeoParquet writes (pubs/geoparquet.py); pins duckdb >=1.5.5,<1.6
]
# topics-thumbnail job — headless MapLibre render of styled PMTiles → PNG (vector/thumbs.py).
# Installed in Dockerfile.topics-thumbs, which also runs `playwright install --with-deps chromium`.
# requests: pulled in transitively by pubs.harvest's logging helpers (hlog) that this job reuses.
thumbs = [
  "playwright>=1.40",
  "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ugs_warehouse.pubs" = ["data/*.geojson"]   # vendored SGID county boundaries (counties.py)
"ugs_warehouse.vector" = ["render_assets/*"]   # vendored maplibre-gl + pmtiles browser libs (topics thumbnails)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the ruleset EXPLICITLY. ruff's default `select` expands with each release,
# so relying on it lets a version bump surface latent nits and turn CI red with
# no code change (that's exactly what happened to this PR's first run). An
# explicit set makes `ruff check` deterministic across ruff versions.
#   E4/E7/E9 = pycodestyle (imports, statements, syntax)
#   F        = pyflakes (real errors: undefined names, unused imports)
#   I        = import sorting (auto-fixable)
# Grow this set deliberately, ideally org-wide, not by accident.
select = ["E4", "E7", "E9", "F", "I"]
