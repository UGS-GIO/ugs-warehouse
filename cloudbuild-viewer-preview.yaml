# Per-PR preview of the REVIEW viewer (#154). Trigger: pull request touching viewer/**.
#
# The prod flavour of this preview is a Firebase Hosting channel now
# (.github/workflows/firebase-hosting-pull-request.yml) — public, no login. What stays here is the
# review flavour, which cannot move: it is built against the review catalog and its assets are
# private, so it has to stay behind IAP. Prod and review previews are both worth having on a viewer
# PR — they differ in catalog, and only the review one exercises the comment/diff surfaces.
#
# Serves from `ugs-warehouse-previews` — its OWN Cloud Run service, own origin, own IAP, reading
# the previews bucket and nothing else. Not the review app: preview JavaScript is unmerged branch
# code, and on that origin it would inherit the reviewer's IAP session (post/delete comments as
# them, pull signed URLs to private review assets). Different host → different cookie, plus CORS.
#
# `--base=/viewer/pr-<n>/` is both the asset prefix and the router basepath (src/lib/mount.ts): the
# viewer has real path routes, so a bundle mounted under a prefix has to be told which one.
# serve.py serves this bundle's own index.html for an unknown path under the subtree.
#
# Expiry is bucket-wide (infra/buckets.tf) — everything in that bucket is a preview, so there is no
# prefix to mis-target and a build that dies halfway still gets swept.
substitutions:
  _REGION: us-central1
  _PREVIEWS_BUCKET: ut-dnr-ugs-maps-prod-previews
  # Static, not resolved at build time: ugs-warehouse-previews lives in ut-dnr-ugs-maps-prod, a
  # DIFFERENT project from where this build runs (ut-dnr-ugs-backend-tools). A `gcloud run services
  # describe` here — like the same-project ones below for features/tiles — would need `--project`
  # AND cross-project run.viewer for the preview-build SA, just to print a URL. Not worth either:
  # the service's *.run.app URL is stable for its lifetime, so it's a substitution instead.
  _PREVIEWS_BASE_URL: https://ugs-warehouse-previews-ufyuidl4mq-uc.a.run.app
  # Static: the preview build identity can't read the prod services to look these up.
  _TILES_BASE_URL: https://ugs-warehouse-tiles-xedvkyurga-uc.a.run.app
  _FEATURES_BASE_URL: https://ugs-warehouse-features-xedvkyurga-uc.a.run.app
  _PREVIEW_PATH: viewer/pr-
  # The review catalog this preview reads. stac.ts derives IS_REVIEW from the "/review/" in it, so
  # this one variable is what makes the bundle the review flavour.
  _REVIEW_SERVING_URL: https://ugs-warehouse-review-serving-ufyuidl4mq-uc.a.run.app

steps:
  - id: build-viewer
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        export VITE_FEATURES_BASE="${_FEATURES_BASE_URL}"
        export VITE_TILES_BASE="${_TILES_BASE_URL}"
        export VITE_CATALOG_URL="${_REVIEW_SERVING_URL}/review/stac/catalog.json"
        export VITE_OFFLINE=0
        cd viewer
        npm ci
        npm run build -- --base=/${_PREVIEW_PATH}$_PR_NUMBER/

  - id: deploy-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        DEST="gs://${_PREVIEWS_BUCKET}/${_PREVIEW_PATH}$_PR_NUMBER"
        gcloud storage rsync viewer/dist "$$DEST" \
          --recursive --delete-unmatched-destination-objects
        # Never cache preview HTML: a force-push has to be visible on reload.
        gcloud storage objects update "$$DEST/index.html" --cache-control="no-cache"
        echo "preview: ${_PREVIEWS_BASE_URL}/${_PREVIEW_PATH}$_PR_NUMBER/"

  # Posting the link as a PR comment lives in .github/workflows/firebase-hosting-pull-request.yml,
  # which upserts ONE comment carrying both this preview and the public Firebase one.
  # Tried it here first (#163) via the GitHub connection's OAuth token — 403s, because Cloud
  # Build's GitHub App install has read/checks scopes, not issues:write. GitHub Actions'
  # own GITHUB_TOKEN gets pull-requests:write for free via `permissions:`, no secret needed, so
  # that's where it belongs. That workflow watches for this trigger's check to go green.

options:
  logging: CLOUD_LOGGING_ONLY
