# Per-PR preview of the warehouse viewer (#154). Trigger: pull request touching viewer/**.
#
# Lands in the PREVIEWS bucket — separate from the review bucket, so the SA running this build
# (which is executing unmerged branch code) has objectAdmin on a throwaway bucket and no access to
# review data. Served by the existing `ugs-warehouse-review-serving` Cloud Run app behind the same
# IAP, so previews are never world-readable.
#
# Expiry is bucket-wide: everything in that bucket is a preview, so the lifecycle rule is "delete
# anything older than 7 days" with no prefix to mis-target. Covers builds that die mid-way.
#
# NOTE on `--base`: this mirrors deploy-viewer-review in cloudbuild.yaml, which bakes an absolute
# base because the bundle is served from a path prefix. That makes a preview a DIFFERENT ARTIFACT
# from the public build (which ships `base: "./"`) — the same caveat #39 raises for the review app.
# Fine for "let a reviewer click the UI"; not a substitute for testing the public bundle.
substitutions:
  _REGION: us-central1
  _FEATURES_SERVICE: ugs-warehouse-features
  _TILES_SERVICE: ugs-warehouse-tiles
  _PREVIEWS_BUCKET: ut-dnr-ugs-maps-prod-previews
  _REVIEW_SERVING_URL: https://ugs-warehouse-review-serving-ufyuidl4mq-uc.a.run.app
  # Object path == URL path, so what serve.py routes and what the bucket holds are the same string.
  _PREVIEW_PATH: preview/viewer/pr-

steps:
  # Same service-URL resolution as the prod build, so the preview's endpoint links aren't dead.
  - id: resolve-service-urls
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_FEATURES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/features_url 2>/dev/null \
          || printf '' > /workspace/features_url
        gcloud run services describe ${_TILES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/tiles_url 2>/dev/null \
          || printf '' > /workspace/tiles_url

  - id: build-preview
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        export VITE_TILES_BASE="$$(cat /workspace/tiles_url 2>/dev/null || true)"
        # Reads the REVIEW catalog, like the live internal viewer — a preview pointed at the public
        # catalog would look right while testing none of the review data path.
        export VITE_CATALOG_URL="${_REVIEW_SERVING_URL}/review/stac/catalog.json"
        cd viewer
        npm ci
        npm run build -- --base=/${_PREVIEW_PATH}$_PR_NUMBER/ --outDir dist-preview

  - id: deploy-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        DEST="gs://${_PREVIEWS_BUCKET}/${_PREVIEW_PATH}$_PR_NUMBER"
        gcloud storage rsync viewer/dist-preview "$$DEST" \
          --recursive --delete-unmatched-destination-objects
        # Never cache preview HTML: a force-push has to be visible on reload.
        gcloud storage objects update "$$DEST/index.html" --cache-control="no-cache"
        echo "preview: ${_REVIEW_SERVING_URL}/${_PREVIEW_PATH}$_PR_NUMBER/"

options:
  logging: CLOUD_LOGGING_ONLY
