# PR validation on Cloud Build (not GitHub Actions) — mirrors the ucrc pattern of running CI on
# Cloud Build so it's independent of GHA runners/billing. Backend (ruff + pytest) and viewer
# (tsc + eslint + vitest) run in parallel; any failure fails the build → the PR check goes red.
#
# Wire via a native Cloud Build trigger (see docs/CLOUD_BUILD_CI.md): PR trigger runs this config;
# it posts status back to the PR through the Cloud Build GitHub app. No push/deploy here — this is
# test-only (deploy stays in cloudbuild.yaml / cloudbuild-viewer.yaml).
#
# Manual run:  gcloud builds submit --config cloudbuild-ci.yaml .

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # ---- backend: ruff + pytest (no DB — the suite runs without one) ----
  - id: backend
    name: python:3.11
    waitFor: ["-"]           # start immediately, in parallel with the viewer step
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        # The harvest shells out to gdalinfo / gdal_translate, as in its image (Dockerfile.harvest).
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq && apt-get install -y -qq --no-install-recommends gdal-bin > /dev/null
        pip install -e ".[dev]"
        ruff check .
        python -m pytest -q

  # ---- featureserv: the pygeoapi plugin against the pinned pygeoapi (the image build runs it too) ----
  - id: featureserv
    name: python:3.12
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        pip install -q -r featureserv/requirements.txt
        cd featureserv && python -m pytest -q -p no:cacheprovider test_ugs_parquet.py

  # ---- docs: every relative Markdown link resolves. Offline, so external URLs never flake the PR;
  # links inside docs/ are also checked by `mkdocs build --strict` in cloudbuild-docs.yaml. ----
  - id: docs-links
    name: lycheeverse/lychee:0.24.2
    waitFor: ["-"]
    args: ["--offline", "--no-progress", "README.md", "AGENTS.md", "GEMINI.md", ".gemini/**/*.md", "docs/**/*.md", "*/README.md"]

  # ---- viewer: typecheck + lint + unit tests + build ----
  # The build is part of CI because the viewer is the deployed artifact and tsc alone does not catch
  # what breaks it (a bad import resolution, a missing asset, a Vite/Rolldown plugin failure).
  - id: viewer
    name: node:22          # matches the deploy builds (cloudbuild-viewer.yaml, cloudbuild.yaml)
    waitFor: ["-"]
    dir: viewer
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm ci
        npx tsc --noEmit
        npx eslint .
        npx vitest run
        npm run build
