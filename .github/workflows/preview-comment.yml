# Posts (and updates) a PR comment linking to the viewer preview built by
# cloudbuild-viewer-preview.yaml (#154/#156/#159).
#
# Why here and not in the Cloud Build step itself: tried that first (#163) using the GitHub
# connection's OAuth token to call the comments API directly from Cloud Build -- 403, because
# Cloud Build's GitHub App install has read/checks scopes, not issues:write. GitHub Actions'
# own GITHUB_TOKEN gets pull-requests:write for free via `permissions:` below, no secret to
# provision or scope-guess. This workflow does no building itself -- it only watches the
# ugs-warehouse-viewer-preview check on the same commit and comments once it's green.
name: PR preview comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["viewer/**"]

permissions:
  pull-requests: write
  checks: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the viewer-preview Cloud Build check
        id: wait
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const checkName = "ugs-warehouse-viewer-preview";
            // Cloud Build's own trigger runs on skip too (non-viewer PRs) -- this workflow only
            // fires on viewer/** changes at all, so a miss here just means the check hasn't
            // reported yet. Poll for ~10 minutes; that's generously above observed build time.
            for (let i = 0; i < 40; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const run = data.check_runs.find((c) => c.name === checkName);
              if (run && run.status === "completed") {
                core.setOutput("conclusion", run.conclusion);
                return;
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setOutput("conclusion", "timeout");

      - name: Upsert the preview-link comment
        if: steps.wait.outputs.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://ugs-warehouse-previews-ufyuidl4mq-uc.a.run.app/viewer/pr-${prNumber}/`;
            const marker = "<!-- ugs-warehouse-preview -->";
            const body = `${marker}\n🔗 **Viewer preview:** ${url}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const mine = comments.data.find((c) => c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
