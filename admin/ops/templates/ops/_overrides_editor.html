{# Editor for one item's metadata override: title + description. Blank field = fall back to source. #}
<div class="rounded-lg border border-slate-200 bg-white p-4">
  <div class="mb-3 flex items-center justify-between">
    <h2 class="font-semibold font-mono">{{ o.id }}</h2>
    {% if o.source %}<span class="text-xs text-slate-400">override: {{ o.source }}</span>{% endif %}
  </div>
  <form hx-post="{% url 'ops:overrides_save' o.id %}" hx-target="#ov-save-result" hx-swap="innerHTML">
    <label class="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">Title <span class="normal-case">(optional)</span></label>
    <input type="text" name="title" value="{{ o.title }}" placeholder="Leave blank to use the source title"
      class="mb-3 w-full rounded border border-slate-300 px-3 py-1.5 text-sm focus:border-slate-500 focus:outline-none">
    <label class="block text-[11px] uppercase tracking-wide text-slate-400 mb-1">Description</label>
    <textarea name="description" rows="5" placeholder="Leave blank to use the source / prior description"
      class="w-full rounded border border-slate-300 px-3 py-1.5 text-sm focus:border-slate-500 focus:outline-none">{{ o.description }}</textarea>
    <div class="mt-3 flex items-center gap-3">
      <button type="submit" class="rounded bg-slate-800 px-3 py-1 text-sm text-white hover:bg-slate-700">Save override</button>
      <span id="ov-save-result" class="text-xs"></span>
    </div>
    <p class="mt-2 text-[11px] text-slate-400">Clearing both fields deletes the override (the item falls back to source metadata).</p>
  </form>
</div>
