# Keeps a standing release PR up to date from conventional commits on main. Merging it tags the
# version and publishes the GitHub release.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
