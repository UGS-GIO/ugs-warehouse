# Docs-only deploy — MkDocs Material build + rsync to the CDN, NO Docker image builds.
# Run by the `ugs-warehouse-docs` Cloud Build trigger (infra/cloudbuild-triggers.tf) on main pushes
# touching docs/** or mkdocs.yml. Runs as the same Cloud Build SA as cloudbuild.yaml (already has
# objectAdmin on the public bucket), so no extra grants.
substitutions:
  _PUBLIC_BUCKET: ut-dnr-ugs-maps-prod-public
  _DOCS_PREFIX: warehouse/docs

steps:
  - id: build-docs
    name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        pip install --quiet -r docs-requirements.txt
        mkdocs build --strict --site-dir site

  # Publish site/ → public bucket → CDN. NOT allowFailure: a failed deploy fails the build.
  # index.html revalidates; hashed assets are immutable.
  - id: deploy-docs
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage rsync site gs://${_PUBLIC_BUCKET}/${_DOCS_PREFIX} \
          --recursive --delete-unmatched-destination-objects
        gcloud storage objects update gs://${_PUBLIC_BUCKET}/${_DOCS_PREFIX}/index.html \
          --cache-control="no-cache"

options:
  logging: CLOUD_LOGGING_ONLY
