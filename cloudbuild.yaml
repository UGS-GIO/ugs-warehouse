# Build the warehouse images, push to Artifact Registry, deploy the Cloud Run services.
#
# Trigger options (pick one):
#   - Cloud Build GitHub trigger on push to main (simplest), or
#   - GH Actions (Workload Identity Federation, keyless) -> `gcloud builds submit`, or
#   - manual `gcloud builds submit --config cloudbuild.yaml`.
#
# Fill the _SUBSTITUTIONS below for your project (or pass --substitutions=...).
# The Cloud Build service account needs: artifactregistry.writer, run.developer,
# and iam.serviceAccountUser ON the runtime SA (_RUNTIME_SA).

substitutions:
  _REGION: us-central1
  _AR_REPO: ugs-warehouse                 # Artifact Registry docker repo name
  _RUNTIME_SA: ""                         # runtime SA email — storage.objectAdmin + cloudsql.client + secretAccessor
  _SQL_INSTANCE: ut-dnr-ugs-mappingdb-prod:us-west3:mapping-db
  _SECRET: dbt-prod-db-password           # Secret Manager secret holding the DB password
  _DATA_PATH: gs://ut-dnr-ugs-maps-prod-public/warehouse/ducklake/
  _JOB: ugs-warehouse-ingest
  _API_SERVICE: ugs-warehouse-api

steps:
  # Build Warehouse
  - id: build-warehouse
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:latest
      - .
  
  # Build API
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:latest
      - api/

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api']

  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # custom delimiter (^@^) so gs:// values with no commas stay safe
      - --set-env-vars=^@^SOURCE_BACKEND=postgres@CLOUDSQL_INSTANCE=${_SQL_INSTANCE}@DB_NAME=seamlessgeolmap@DB_USER=schema_owner@DUCKLAKE_DATA_PATH=${_DATA_PATH}
      - --command=scripts/cloudrun_entrypoint.sh
      - --args=--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=2Gi

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # Set env vars carefully - use ^@^ to avoid comma-parsing issues
      - --set-env-vars=^@^PGF_DATABASE_URL=postgres://schema_owner:$$DB_PASS@localhost:5432/seamlessgeolmap
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api

options:
  logging: CLOUD_LOGGING_ONLY
