<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Warehouse Ops{% endblock %} · UGS</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <script>
    document.addEventListener('htmx:configRequest', function (e) {
      e.detail.headers['X-CSRFToken'] = document.querySelector('meta[name=csrf-token]').content;
    });
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-slate-800 text-white px-4 sm:px-5 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3 sm:gap-6 min-w-0">
      <a href="{% url 'ops:dashboard' %}" class="font-semibold hover:text-slate-200 truncate">UGS Warehouse · Ops Console</a>
      <nav class="hidden sm:flex gap-4 text-sm font-medium text-slate-300">
        <a href="{% url 'ops:dashboard' %}" class="hover:text-white transition">Operations</a>
        <a href="{% url 'ops:publications' %}" class="hover:text-white transition">Harvest Registry</a>
      </nav>
    </div>
    <div class="flex items-center gap-3 text-xs text-slate-300 shrink-0">
      <button id="tzbtn" onclick="toggleTz()" title="Toggle timezone (Local / UTC)"
              class="rounded border border-slate-600 px-2 py-0.5 hover:bg-slate-700">Local</button>
      <span class="hidden sm:inline max-w-[40vw] truncate">{{ iap_email|default:"—" }}{% if dry_run %} · <span class="text-amber-300 font-medium">DRY-RUN</span>{% endif %}</span>
    </div>
  </header>
  <main class="max-w-[1700px] mx-auto px-5 sm:px-8 py-6">{% block content %}{% endblock %}</main>

  <script>
    // Inline log accordion: clicking a "logs" button expands a panel right below the clicked row/card.
    // Loads on open; clears on close (stops any self-polling partial inside).
    function toggleAccordion(wrapId, url, loadId) {
      const w = document.getElementById(wrapId);
      if (!w) return;
      const target = loadId || wrapId;
      if (w.classList.contains('hidden')) {
        w.classList.remove('hidden');
        if (url) htmx.ajax('GET', url, { target: '#' + target, swap: 'innerHTML' });
      } else {
        w.classList.add('hidden');
        const t = document.getElementById(target);
        if (t) t.innerHTML = '';
      }
    }

    // Timestamps: server sends UTC ISO in <time data-ts>; render in the viewer's local zone or UTC.
    // "Local" = the browser's own timezone (whatever you're in); UTC always one click away.
    function tzMode() { return localStorage.getItem('tzmode') || 'local'; }
    function fmtTimes() {
      const utc = tzMode() === 'utc';
      document.querySelectorAll('time[data-ts]').forEach(el => {
        const iso = el.getAttribute('data-ts');
        if (!iso) { el.textContent = ''; return; }
        const opts = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                       minute: '2-digit', hour12: false, timeZoneName: 'short' };
        if (el.hasAttribute('data-sec')) opts.second = '2-digit';  // log lines want seconds
        if (utc) opts.timeZone = 'UTC';
        const d = new Date(iso);
        el.textContent = d.toLocaleString('en-US', opts);
        el.title = d.toISOString();  // raw UTC always on hover
      });
      const btn = document.getElementById('tzbtn');
      if (btn) btn.textContent = utc ? 'UTC' : 'Local';
    }
    // Ops tabs (Run/Watch/Data): highlight the clicked one; htmx swaps the body (unmounting the
    // previous tab's content stops its polling).
    function opsTab(btn) {
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.remove('border-slate-800', 'font-medium', 'text-slate-800');
        b.classList.add('border-transparent', 'text-slate-500');
      });
      btn.classList.remove('border-transparent', 'text-slate-500');
      btn.classList.add('border-slate-800', 'font-medium', 'text-slate-800');
    }

    function toggleTz() { localStorage.setItem('tzmode', tzMode() === 'utc' ? 'local' : 'utc'); fmtTimes(); }
    document.addEventListener('DOMContentLoaded', fmtTimes);
    document.body.addEventListener('htmx:afterSwap', fmtTimes);  // re-format after status polls swap

    // Job-done ping: status partials carry data-job/data-state (newest execution). When a job goes
    // running → succeeded/failed, fire a browser notification (tab can be in the background).
    const jobStates = {};
    function checkJobDone() {
      document.querySelectorAll('[data-job][data-state]').forEach((el) => {
        const job = el.getAttribute('data-job'), state = el.getAttribute('data-state'), prev = jobStates[job];
        if (prev === 'running' && (state === 'succeeded' || state === 'failed')
            && 'Notification' in window && Notification.permission === 'granted') {
          new Notification(`Job ${state}: ${job}`, { body: state === 'succeeded' ? '✓ completed' : '⚠ failed — check logs' });
        }
        jobStates[job] = state;
      });
    }
    document.body.addEventListener('htmx:afterSwap', checkJobDone);
    // Ask permission on a real gesture — when you trigger a job.
    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('[hx-post]');
      if (btn && /\/jobs\/[^/]+\/run/.test(btn.getAttribute('hx-post') || '')
          && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    });
  </script>
</body>
</html>
