# Viewer-only fast deploy — Vite build + rsync to CDN, NO Docker image builds.
# Submitted (sync) by .github/workflows/viewer.yml on viewer/** pushes. Runs as the same Cloud
# Build SA as cloudbuild.yaml (already has objectAdmin on the public bucket), so no extra grants.
# The three steps mirror cloudbuild.yaml's resolve-features-url / build-viewer / deploy-viewer.
substitutions:
  _REGION: us-central1
  _FEATURES_SERVICE: ugs-warehouse-features
  _PUBLIC_BUCKET: ut-dnr-ugs-maps-prod-public
  _VIEWER_PREFIX: warehouse/viewer

steps:
  # Resolve the deployed OGC API Features URL → file, baked into the viewer as VITE_FEATURES_BASE.
  # Empty file if the service isn't up → the OGC endpoints stay hidden (no dead link).
  - id: resolve-features-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_FEATURES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/features_url 2>/dev/null \
          || printf '' > /workspace/features_url
        echo "VITE_FEATURES_BASE=$$(cat /workspace/features_url)"

  - id: build-viewer
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        cd viewer
        npm ci
        npm run build

  # Publish viewer/dist → public bucket → CDN. NOT allowFailure here: a failed deploy must fail
  # the build so the GH run (sync) goes red. index.html revalidates; hashed assets are immutable.
  - id: deploy-viewer
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage rsync viewer/dist gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX} \
          --recursive --delete-unmatched-destination-objects
        gcloud storage objects update gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX}/index.html \
          --cache-control="no-cache"
        # SPA deep-link fix: the viewer's deep links are /warehouse/viewer/?c=…&i=… — on reload
        # GCS resolves the object "warehouse/viewer/" (query dropped) and, with no index document,
        # returns NoSuchKey. Set the bucket main-page suffix so any directory request serves its
        # index.html. Only affects trailing-slash directory requests — STAC/COG objects are real
        # keys, unaffected. (No error-page: that would hijack legitimate STAC 404s.) Idempotent;
        # best-effort — needs storage.buckets.update (objectAdmin lacks it); set once, persists.
        gcloud storage buckets update gs://${_PUBLIC_BUCKET} --web-main-page-suffix=index.html \
          || echo "main-page-suffix not set (needs storage.buckets.update on ${_PUBLIC_BUCKET})"

options:
  logging: CLOUD_LOGGING_ONLY
