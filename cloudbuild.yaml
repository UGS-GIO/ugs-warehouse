# Build the warehouse images, push to Artifact Registry, deploy the Cloud Run services.
#
# Trigger options (pick one):
#   - Cloud Build GitHub trigger on push to main (simplest), or
#   - GH Actions (Workload Identity Federation, keyless) -> `gcloud builds submit`, or
#   - manual `gcloud builds submit --config cloudbuild.yaml`.
#
# Fill the _SUBSTITUTIONS below for your project (or pass --substitutions=...).
# The Cloud Build service account needs: artifactregistry.writer, run.developer,
# and iam.serviceAccountUser ON the runtime SA (_RUNTIME_SA).

substitutions:
  _REGION: us-central1
  _AR_REPO: ugs-warehouse                 # Artifact Registry docker repo name
  _RUNTIME_SA: warehouse-run@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com                         # runtime SA email — storage.objectAdmin + cloudsql.client + secretAccessor
  _SQL_INSTANCE: ut-dnr-ugs-mappingdb-prod:us-west3:mapping-db
  _SECRET: dbt-prod-db-password           # Secret Manager secret holding the DB password
  _DATA_PATH: gs://ut-dnr-ugs-maps-prod-public/warehouse/ducklake/
  _JOB: ugs-warehouse-ingest              # Cloud Run job (batch --all reingest). Distinct resource from the Pub/Sub topic of the same name below.
  _REVIEW_JOB: ugs-warehouse-ingest-review # Cloud Run job: same ingest over `_review` serving tables → writes the gated catalog under review/ (pre-release; promote _review→_current to publish)
  _MAINTAIN_JOB: ugs-warehouse-ducklake-maintain # Cloud Run job: DuckLake housekeeping (expire snapshots + compact small files + GC orphaned parquet). Run weekly.
  _PUBS_JOB: ugs-pubs-ingest              # Cloud Run job: rebuild the ugs-publications STAC collection from pub metadata (no COG re-harvest)
  _PUBTHUMB_JOB: ugs-pubs-thumbs          # Cloud Run job: render PDF first-page cover thumbnails for every pub (poppler)
  _PIPELINE_JOB: ugs-pubs-pipeline        # Cloud Run job: orchestrator — loops thumbs then runs pubs-ingest (one-click "full refresh")
  _FTS_JOB: ugs-pubs-fts                  # Cloud Run job: build the all-pub full-text-search DuckDB (BM25 FTS) → CDN, queried by duckdb-wasm
  _EMBED_JOB: ugs-pubs-embed              # Cloud Run job: chunk + embed every pub (bge-small) → DuckDB VSS (HNSW) → CDN, for semantic search
  _MOSAICS_JOB: ugs-geolmap-mosaics       # Cloud Run job: per-scale raster PMTiles mosaics of the published geologic maps (GDAL + pmtiles)
  _GRAPH_JOB: ugs-pubs-graph              # Cloud Run job: build the pubs knowledge graph (nodes/edges Parquet) — citation + co-author + semantic edges
  _THREED_JOB: ugs-pubs-threed            # Cloud Run job: convert 3D GeMS pubs (gdb+.mapx) → GeoParquet-3D + glTF + classes sidecar; --all auto-discovers, pubs-ingest binds the assets
  _RESTYLE_JOB: ugs-warehouse-restyle     # Cloud Run job: rebind ugs-styles renders into STAC items (no reingest) — ugs-styles publish CI triggers it
  _TOPICTHUMB_JOB: ugs-topics-thumbs      # Cloud Run job: render styled-PMTiles preview PNGs for ugs-serving-topics (headless MapLibre); content-hash skip, chain after ingest + restyle
  _API_SERVICE: ugs-warehouse-api
  _FEATURES_SERVICE: ugs-warehouse-features   # OGC API Features for Arc Pro (duckdb_featureserv over GeoParquet, scale-to-zero)
  _SERVICE: ugs-warehouse-service
  # Ops console (Django + HTMX, behind IAP) — triggers the jobs above + shows catalog coverage.
  _ADMIN_SERVICE: ugs-warehouse-admin
  _ADMIN_SA: warehouse-admin-run@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com  # runtime SA — run.developer (trigger/status) + logging.viewer (live + per-pub logs) + storage.objectViewer on the COG bucket (registry harvest status)
  _ADMIN_HOSTS: .run.app                                                           # ALLOWED_HOSTS; add the LB/custom domain once IAP is fronted
  _ADMIN_SECRET: warehouse-admin-secret-key                                        # Secret Manager secret — stable Django SECRET_KEY across workers/instances
  # Pub/Sub topic/subscription names live in scripts/provision.sh now (not build inputs).
  # public OGC api connects read-only — never schema_owner (role + secret provisioned by Marshall)
  _API_DB_USER: schema_reader
  _API_SECRET: schema-reader-db-password
  # Static STAC viewer → public bucket → CDN (https://maps-assets.geology.utah.gov/warehouse/viewer/)
  _PUBLIC_BUCKET: ut-dnr-ugs-maps-prod-public
  # Private review bucket (tofu-created, no CDN) + the IAP-gated *.run.app URL of the review serving
  # app (tofu `serving_url` output). The review ingest job writes here + tags STAC hrefs at this host.
  _REVIEW_BUCKET: ut-dnr-ugs-maps-prod-review
  _REVIEW_SERVING_URL: https://ugs-warehouse-review-serving-ufyuidl4mq-uc.a.run.app
  _REVIEW_PROJECT: ut-dnr-ugs-maps-prod   # the serving Cloud Run service + buckets live HERE, not the build's $PROJECT_ID (backend-tools)
  _VIEWER_PREFIX: warehouse/viewer
  _REVIEW_VIEWER_PREFIX: review/viewer      # internal viewer bundle in the PRIVATE review bucket (served by the IAP app, never the CDN)
  # Tag used for images (defaults to SHORT_SHA in automated triggers)
  _TAG: $SHORT_SHA

steps:
  # Build Warehouse
  # Layer cache: pull the prior :latest + --cache-from (inline cache) so unchanged apt/pip-deps
  # layers are reused — only the app layer rebuilds on a code change. tippecanoe is COPY'd from
  # the prebuilt base (no compile).
  - id: build-warehouse
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse
        TIP=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-tippecanoe:latest
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg TIPPECANOE_IMAGE="$$TIP" \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .
  
  # Build API
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:latest
      - api/
    env:
      - DOCKER_BUILDKIT=1

  # Build Harvest
  - id: build-harvest
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest
        TIP=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-tippecanoe:latest
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build -f Dockerfile.harvest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg TIPPECANOE_IMAGE="$$TIP" \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  # Thin orchestrator (cloud-sdk + scripts/pipeline.sh) for the one-click publications refresh.
  - id: build-pipeline
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-pubs-pipeline
        docker build -f Dockerfile.pipeline -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  # OGC API Features for Arc Pro — duckdb_featureserv over GeoParquet (DuckDB views on the CDN
  # parquet). Builds a tiny DuckDB file from the STAC catalog at image-build time (needs network).
  - id: build-features
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:latest
      - featureserv/

  # Ops console (Django + HTMX). Build context is the repo root (Dockerfile.admin COPYs admin/).
  - id: build-admin
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build -f Dockerfile.admin \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  # Topics-thumbnail renderer: Python orchestrator + Node/puppeteer/Chromium (headless MapLibre).
  - id: build-topics-thumbs
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        IMG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-topics-thumbs
        docker pull "$$IMG:latest" || true
        DOCKER_BUILDKIT=1 docker build -f Dockerfile.topics-thumbs \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --cache-from "$$IMG:latest" \
          -t "$$IMG:${_TAG}" -t "$$IMG:latest" .

  - id: push-warehouse
    waitFor: [build-warehouse]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse']

  - id: push-topics-thumbs
    waitFor: [build-topics-thumbs]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-topics-thumbs']

  - id: push-admin
    waitFor: [build-admin]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin']

  - id: push-features
    waitFor: [build-features]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features']

  - id: push-api
    waitFor: [build-api]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api']

  - id: push-harvest
    waitFor: [build-harvest]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest']

  - id: push-pipeline
    waitFor: [build-pipeline]
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-pubs-pipeline']

  - id: deploy-job
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # custom delimiter (^@^) so gs:// values with no commas stay safe
      - --set-env-vars=^@^SOURCE_BACKEND=postgres@CLOUDSQL_INSTANCE=${_SQL_INSTANCE}@DB_NAME=seamlessgeolmap@DB_USER=schema_owner@DUCKLAKE_DATA_PATH=${_DATA_PATH}@DUCKDB_MAX_MEMORY=1.5GB
      - --command=scripts/cloudrun_entrypoint.sh
      - --args=--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=2Gi

  # REVIEW ingest — identical to the job above but reads `_review` serving tables and writes the
  # whole catalog under review/ (STAC + GeoParquet + PMTiles + a separate DuckLake root). Feeds the
  # internal/gated catalog; nothing here touches the public warehouse/ artifacts. Run on demand:
  # `gcloud run jobs execute ${_REVIEW_JOB} --region=${_REGION}`. Promote _review→_current to publish.
  - id: deploy-review-ingest-job
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_REVIEW_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # Same source config as the public job + the review switch (WAREHOUSE_TABLE_SUFFIX=_review) and
      # review output prefixes (STAC/ARCHIVE/PMTILES/THUMBS + an isolated DuckLake root under review/).
      # #16 cutover: write the review catalog to the PRIVATE bucket (not public review/) + tag STAC
      # hrefs at the IAP serving host. review/* object prefixes stay (harmless inside a private bucket).
      # STYLES_CDN_BASE is pinned to the PUBLIC styles CDN: it otherwise defaults to
      # {WAREHOUSE_PUBLIC_BASE_URL}/styles = the IAP review-serving host, which has no /styles folder, so
      # the styles manifest 404s and review items get NO ugs:renders (unsymbolized). ugs-styles publishes
      # CDN-only; styles aren't secret, so the review app fetching them from the public CDN is fine.
      # Review needs its OWN DuckLake metadata schema: a catalog binds one DATA_PATH, so sharing the
      # public catalog while writing to the review bucket fails to attach.
      - --set-env-vars=^@^SOURCE_BACKEND=postgres@CLOUDSQL_INSTANCE=${_SQL_INSTANCE}@DB_NAME=seamlessgeolmap@DB_USER=schema_owner@WAREHOUSE_BUCKET=${_REVIEW_BUCKET}@WAREHOUSE_PUBLIC_BASE_URL=${_REVIEW_SERVING_URL}@STYLES_CDN_BASE=https://maps-assets.geology.utah.gov/styles@DUCKLAKE_DATA_PATH=gs://${_REVIEW_BUCKET}/review/ducklake/@DUCKLAKE_METADATA_SCHEMA=ducklake_catalog_review@DUCKDB_MAX_MEMORY=1.5GB@WAREHOUSE_TABLE_SUFFIX=_review@WAREHOUSE_STAC_PREFIX=review/stac@WAREHOUSE_ARCHIVE_PREFIX=review/geoparquet@WAREHOUSE_PMTILES_PREFIX=review/pmtiles@WAREHOUSE_THUMBS_PREFIX=review/thumbs
      - --command=scripts/cloudrun_entrypoint.sh
      - --args=--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=2Gi

  # Review serving app (ugs-warehouse#16) — the IAP-gated Cloud Run service that streams the private
  # review bucket. tofu owns its config + IAP + ingress and IGNORES the image, so cloudbuild just ships
  # the current image here. CRITICAL: this is the ONE step targeting the OTHER project — the service
  # lives in ${_REVIEW_PROJECT} (maps-prod), NOT the build's $PROJECT_ID (backend-tools). Without an
  # explicit --project, `gcloud run services update` defaults to the build project and SILENTLY CREATES
  # a duplicate service in the wrong project while the real one never gets the image. The image itself
  # DOES live in $PROJECT_ID's Artifact Registry (cross-project pull). The build SA needs run.admin on
  # the service — tofu grants it (build_deploy_serving, gated on build_service_account).
  - id: deploy-review-serving
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ugs-warehouse-review-serving
      - --project=${_REVIEW_PROJECT}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}

  # Non-IAP twin (tofu-created; serves the hazards-review app). Same image; only the image is updated
  # here — env/CloudSQL/no-IAP config is owned by infra/serving-review-api.tf. allowFailure so a
  # missing service / not-yet-granted build SA can't block the whole deploy (needs the service to exist
  # + build_deploy_review_api in iam.tf; until tf-apply lands both, this step no-ops).
  - id: deploy-review-api
    waitFor: [push-warehouse]
    allowFailure: true
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ugs-warehouse-review-api
      - --project=${_REVIEW_PROJECT}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}

  # DuckLake maintenance — expire old snapshots, compact small parquet, GC orphaned files. Same
  # image + DSN setup as the ingest job (RUN_MODULE swaps the CLI). Run periodically (weekly is plenty):
  # `gcloud run jobs execute ${_MAINTAIN_JOB} --region=${_REGION}` (or the ops console button).
  - id: deploy-ducklake-maintain-job
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MAINTAIN_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=DB_PASS=${_SECRET}:latest
      # DUCKLAKE_KEEP_DAYS=30: data updates are infrequent — keep a month of snapshots so the previous
      # data version stays rollback-able. Raise it toward your real update interval if that's longer.
      - --set-env-vars=^@^RUN_MODULE=ugs_warehouse.vector.maintain@SOURCE_BACKEND=postgres@CLOUDSQL_INSTANCE=${_SQL_INSTANCE}@DB_NAME=seamlessgeolmap@DB_USER=schema_owner@DUCKLAKE_DATA_PATH=${_DATA_PATH}@DUCKLAKE_KEEP_DAYS=30
      - --command=scripts/cloudrun_entrypoint.sh
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=2Gi

  - id: deploy-harvest-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - geolmap-harvest
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_SECRET}:latest
      - --set-env-vars=^|^SOURCE_BACKEND=postgres|POSTGRES_DSN=host=/cloudsql/${_SQL_INSTANCE} dbname=seamlessgeolmap user=schema_owner|DUCKLAKE_DATA_PATH=${_DATA_PATH}
      - --command=python
      - --args=-m,ugs_warehouse.pubs.harvest,--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=4Gi
      - --tasks=5

  # Pubs metadata → STAC rebuild. Decoupled from the COG harvest above: this only re-reads
  # pub metadata (live from the publications app feed via PUBS_DB_URL) + lists GCS for harvested
  # artifacts, then rewrites the ugs-publications items + refresh_catalog. NO GDAL, NO COG
  # re-harvest. Uses the harvest image (it carries the `pubs` extra / geopandas that
  # footprints.geoms needs). Reads the app feed over Cloud SQL (schema_reader); artifacts from GCS.
  # Run after a metadata edit: `gcloud run jobs execute ${_PUBS_JOB} --region=${_REGION}`.
  - id: deploy-pubs-ingest-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_PUBS_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.ingest
      - --task-timeout=1800
      - --max-retries=1
      - --cpu=1
      - --memory=2Gi

  # Cover thumbnails — render each pub's PDF first page → PNG in GCS (poppler/pdftoppm). Covers ALL
  # pubs incl. non-spatial (Survey Notes, reports). Sharded + skip-existing like the COG harvest;
  # run a `pubs-ingest` after to bind the new `preview` assets. Harvest image (has poppler); CSV+GCS.
  - id: deploy-pubthumbs-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_PUBTHUMB_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.thumbs,--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      # 8Gi headroom: the biggest pub PDF is ~650MB (swept) and Cloud Run /tmp is RAM-backed, so the
      # download + poppler render/extract of a giant fits with margin. No spot VM, no GB-RAM bills.
      - --memory=8Gi
      - --tasks=5

  # Styled-preview thumbnails for vector serving-topics — headless MapLibre (Node/puppeteer/Chromium)
  # renders each topic's styled PMTiles → PNG. Content-hash skip means it's safe to run after every
  # vector ingest AND every restyle; it only re-renders topics whose style changed. Run a vector
  # ingest (or restyle) after to bind the new `thumbnail` assets onto the items. Chromium = more RAM.
  - id: deploy-topics-thumbs-job
    waitFor: [push-topics-thumbs]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_TOPICTHUMB_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-topics-thumbs:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --command=python
      - --args=-m,ugs_warehouse.vector.thumbs,--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=4Gi
      - --tasks=3

  # One-click "full refresh" orchestrator: loops the thumbs job to completion then runs pubs-ingest
  # (binds covers/contents/volume + builds the search corpus). Triggered from the ops console. Its SA
  # needs execute rights on ONLY the two sub-jobs (job-level run.developer, least privilege) + actAs
  # on ${_RUNTIME_SA} — both granted by scripts/provision.sh.
  - id: deploy-pipeline-job
    waitFor: [push-pipeline]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_PIPELINE_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-pubs-pipeline:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-env-vars=REGION=${_REGION},WAREHOUSE_BUCKET=${_PUBLIC_BUCKET},THUMBS_JOB=${_PUBTHUMB_JOB},THREED_JOB=${_THREED_JOB},INGEST_JOB=${_PUBS_JOB},FTS_JOB=${_FTS_JOB},EMBED_JOB=${_EMBED_JOB}
      - --task-timeout=86400
      - --max-retries=0
      - --cpu=1
      - --memory=512Mi

  # Rebind ugs-styles renders into STAC items (no reingest). The ugs-styles publish CI executes
  # this after pushing the styles CDN. Deployed here so it tracks the CURRENT warehouse image —
  # else its render-block logic (e.g. legend passthrough) goes stale. Uses the warehouse image
  # (core only; no geopandas), no Cloud SQL / DB (reads GCS + the styles manifest, rewrites item.json).
  - id: deploy-restyle-job
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_RESTYLE_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --command=python
      - --args=-m,ugs_warehouse.restyle
      - --task-timeout=1800
      - --max-retries=1
      - --cpu=1
      - --memory=2Gi

  # Build the all-pub full-text-search DuckDB (BM25 FTS over pubs/fulltext/*.txt) → CDN. Warehouse
  # image (has duckdb; INSTALL fts fetches the extension at runtime). Memory-heavy: holds the whole
  # text corpus + index while building. Run after the thumbs full-text pass; the viewer queries the
  # result client-side via duckdb-wasm range reads.
  - id: deploy-fts-job
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_FTS_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.fts
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=8Gi

  # Chunk + embed every pub's text (bge-small via fastembed) → DuckDB VSS (HNSW) → CDN, for semantic
  # search. Harvest image (has the [pubs] extra incl. fastembed). CPU-bound (ONNX inference) + holds
  # the corpus + vectors while indexing — hence high cpu/memory + a long timeout. Run after thumbs.
  - id: deploy-embed-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_EMBED_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.embed
      - --task-timeout=7200
      - --max-retries=1
      - --cpu=4
      - --memory=8Gi

  # Per-scale raster PMTiles mosaics of the published geologic maps (old ArcGIS MD_* equivalent).
  # Harvest image (GDAL CLI + the go-pmtiles binary). Reads the COGs in place over /vsigs (no full
  # download), but the rendered MBTiles lands in RAM-backed /tmp — so the 24k tier is the heavy one.
  # Defaults to --scale all; for the big 24k tier, execute with --args override + more memory, e.g.
  #   gcloud run jobs execute ugs-geolmap-mosaics --args=-m,ugs_warehouse.pubs.geolmap_mosaics,--scale,24k
  - id: deploy-mosaics-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MOSAICS_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.geolmap_mosaics,--scale,all
      # Zoom is now capped per tier (TIER_MAXZOOM), so the build is bounded; 4h is generous headroom
      # for the 24k tier (the others are fast). Run a single heavy tier with --scale 24k if needed.
      - --task-timeout=14400
      - --max-retries=1
      - --cpu=4
      - --memory=16Gi

  # 3D GeMS publication convert: GDB + .mapx → GeoParquet-3D (polys+lines, WKB-Z) + glTF mesh +
  # classes sidecar. `--all` auto-discovers every 3D-eligible pub (attachments carry a gdb.zip + .mapx)
  # and converts skip-existing, sharded — the 3D "harvest". The pubs-ingest then binds the assets
  # (presence-driven). Harvest image ([pubs] extra: geopandas/pyogrio/pygltflib/mapbox-earcut).
  # One-off re-convert of a single pub: override --args with --id/--gdb/--mapx/--upload.
  - id: deploy-3d-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_THREED_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.threed,--all
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=2
      - --memory=8Gi

  # Publications knowledge graph: nodes/edges Parquet (authored/coauthor/in_series/has_topic +
  # cites mined from full text + semantic 'similar' from embeddings). Harvest image (pandas/pyarrow/
  # numpy via [pubs]). Reads fulltext + embeddings from GCS; run after the FTS + embed jobs.
  - id: deploy-graph-job
    waitFor: [push-harvest]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_GRAPH_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^PUBS_DB_URL=host=/cloudsql/${_SQL_INSTANCE} dbname=ucrc user=${_API_DB_USER}|PUBS_TABLE=publications.pubs_feed_v1|PUBS_ATT_TABLE=publications.pubs_attachments_feed_v1
      - --command=python
      - --args=-m,ugs_warehouse.pubs.graph
      - --task-timeout=3600
      - --max-retries=1
      - --cpu=4
      - --memory=8Gi

  - id: deploy-service
    waitFor: [push-warehouse]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_SECRET}:latest
      - --set-env-vars=^|^SOURCE_BACKEND=postgres|POSTGRES_DSN=host=/cloudsql/${_SQL_INSTANCE} dbname=seamlessgeolmap user=schema_owner|DUCKLAKE_DATA_PATH=${_DATA_PATH}
      # ingest runs synchronously inside the push handler — give it room past the 300s default
      - --timeout=3600

  # Ops console — gated by direct Cloud Run IAP (--iap, no load balancer). Grant users the
  # iap.httpsResourceAccessor role on the service out-of-band. The runtime SA (_ADMIN_SA) also needs
  # logging.viewer (live + per-pub logs) and storage.objectViewer on the COG bucket (registry).
  - id: deploy-admin
    waitFor: [push-admin]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_ADMIN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin:${_TAG}
      - --region=${_REGION}
      - --service-account=${_ADMIN_SA}
      - --ingress=all
      - --iap
      - --no-allow-unauthenticated
      - --set-secrets=SECRET_KEY=${_ADMIN_SECRET}:latest
      - --set-env-vars=^|^DEBUG=False|JOBS_DRY_RUN=False|ALLOWED_HOSTS=${_ADMIN_HOSTS}|GCP_PROJECT=$PROJECT_ID|GCP_REGION=${_REGION}

  # NB: Pub/Sub topic + push subscription + run.invoker are NOT wired here — they're one-time infra,
  # provisioned out-of-band by `just provision` (scripts/provision.sh). Builds only build + deploy
  # code, so they no longer re-assert infra (or log "already exists") every push.

  - id: deploy-api
    waitFor: [push-api]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --set-cloudsql-instances=${_SQL_INSTANCE}
      - --set-secrets=PGPASSWORD=${_API_SECRET}:latest
      - --set-env-vars=^|^DATABASE_URL=postgresql://${_API_DB_USER}@/seamlessgeolmap?host=/cloudsql/${_SQL_INSTANCE}|PGFS_DATABASE_DBCONNECTION=postgresql://${_API_DB_USER}@/seamlessgeolmap?host=/cloudsql/${_SQL_INSTANCE}
      - --allow-unauthenticated

  # OGC API Features (Arc Pro) — scale-to-zero, no Cloud SQL / secrets (reads public CDN parquet).
  - id: deploy-features
    waitFor: [push-features]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FEATURES_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features:${_TAG}
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --port=9000
      - --cpu=1
      - --memory=512Mi
      - --timeout=120

  # Resolve the deployed OGC API Features URL → file, so the viewer can bake it as
  # VITE_FEATURES_BASE (the "OGC API" link). Runs after deploy-features (serial order); empty
  # file if the service isn't up → the viewer link stays hidden (no dead link).
  - id: resolve-features-url
    waitFor: [deploy-features]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_FEATURES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/features_url 2>/dev/null \
          || printf '' > /workspace/features_url
        echo "VITE_FEATURES_BASE=$$(cat /workspace/features_url)"

  # Build the static STAC viewer (Vite, base "./" so it works under any CDN subpath).
  - id: build-viewer
    waitFor: [resolve-features-url]
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        cd viewer
        npm ci
        npm run build

  # Publish viewer/dist → public bucket → CDN. Idempotent rsync; index.html revalidates
  # (hashed assets are immutable). allowFailure until the build SA has objectAdmin on the
  # bucket (grant in docs/DEPLOY.md §5).
  - id: deploy-viewer
    waitFor: [build-viewer]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        gcloud storage rsync viewer/dist gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX} \
          --recursive --delete-unmatched-destination-objects
        gcloud storage objects update gs://${_PUBLIC_BUCKET}/${_VIEWER_PREFIX}/index.html \
          --cache-control="no-cache"

  # Internal review viewer (ugs-warehouse#16) — same codebase, built against the review catalog +
  # served THROUGH the IAP app from the private review bucket (same-origin as the STAC/assets, one IAP
  # session). Separate outDir (dist-review) + Vite base so it neither clobbers the public dist nor
  # mis-resolves its own asset URLs (they live under /review/viewer/). Runs after build-viewer, so
  # node_modules is already installed in the shared workspace.
  - id: build-viewer-review
    waitFor: [build-viewer]
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        export VITE_CATALOG_URL="${_REVIEW_SERVING_URL}/review/stac/catalog.json"
        cd viewer
        npm run build -- --base=/${_REVIEW_VIEWER_PREFIX}/ --outDir dist-review

  # Publish → PRIVATE review bucket (served by the IAP app, never the CDN). allowFailure until the
  # build SA has objectAdmin on the review bucket (tofu grants it: build_write_review, gated on
  # build_service_account being set).
  - id: deploy-viewer-review
    waitFor: [build-viewer-review]
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    allowFailure: true
    args:
      - -c
      - |
        gcloud storage rsync viewer/dist-review gs://${_REVIEW_BUCKET}/${_REVIEW_VIEWER_PREFIX} \
          --recursive --delete-unmatched-destination-objects
        gcloud storage objects update gs://${_REVIEW_BUCKET}/${_REVIEW_VIEWER_PREFIX}/index.html \
          --cache-control="no-cache"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-warehouse-admin
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-api
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-features
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-harvest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-pubs-pipeline
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/ugs-topics-thumbs

options:
  logging: CLOUD_LOGGING_ONLY
