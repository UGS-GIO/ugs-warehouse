# Build the viewer and publish it to one Firebase Hosting site. Called by firebase-hosting-merge.yml
# (main → the live site) and firebase-hosting-develop.yml (develop → the dev site).
#
# Deploy lives in Actions rather than Cloud Build for the reason in firebase-hosting-pull-request.yml:
# Cloud Build has no Firebase credentials, and granting its SA project-level
# roles/firebasehosting.admin is the only way it could get them.
name: Viewer deploy (reusable)

on:
  workflow_call:
    inputs:
      site:
        type: string
        required: true
      features_base:
        type: string
        default: ""
      tiles_base:
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Build
        working-directory: viewer
        env:
          VITE_FEATURES_BASE: ${{ inputs.features_base }}
          VITE_TILES_BASE: ${{ inputs.tiles_base }}
        run: |
          npm ci
          npm run build

      # firebase.json names the live site; point this deploy at the requested one.
      - name: Target site
        run: jq --arg site "${{ inputs.site }}" '.hosting.site = $site' firebase.json > firebase.tmp && mv firebase.tmp firebase.json

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UT_DNR_UGS_MAPS_PROD }}
          projectId: ut-dnr-ugs-maps-prod
          channelId: live
          firebaseToolsVersion: "13.29.1"
