{% comment %}Step 2 — the real run, or the refusal when the typed confirmation did not match.{% endcomment %}
<div class="rounded-lg border {% if result.ok %}border-slate-200 bg-white{% else %}border-red-200 bg-red-50{% endif %} p-3">
  <div class="text-sm {% if result.ok %}text-slate-800{% else %}text-red-700{% endif %}">{{ result.message }}</div>
  {% if result.ok %}
  <div class="mt-2 flex items-center gap-3 text-xs">
    <button class="text-slate-600 hover:text-slate-900 underline"
            onclick="toggleAccordion('logs-retire', '{% url 'ops:job_logs' 'retire' %}')">Show live logs ▾</button>
    <a href="{% url 'ops:retire' %}" class="text-blue-600 hover:underline">Retire another →</a>
  </div>
  <div id="logs-retire" class="hidden mt-2"></div>
  {% endif %}
</div>
