name: Viewer CI

# Typecheck + lint + unit tests for viewer changes. Deploy (viewer.yml) stays separate.
on:
  push:
    branches: [main]
    paths: ['viewer/**']
  pull_request:
    paths: ['viewer/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Test
        run: npx vitest run
