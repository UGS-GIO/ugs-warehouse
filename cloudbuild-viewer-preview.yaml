# Per-PR preview of the warehouse viewer (#154). Trigger: pull request touching viewer/**.
#
# Serves from `ugs-warehouse-previews` — its OWN Cloud Run service, own origin, own IAP, reading
# the previews bucket and nothing else. Not the review app: preview JavaScript is unmerged branch
# code, and on that origin it would inherit the reviewer's IAP session (post/delete comments as
# them, pull signed URLs to private review assets). Different host → different cookie, plus CORS.
#
# THE SAME BYTES AS PROD. No `--base` override, no separate outDir: the viewer builds `base: "./"`
# and has exactly one route (all state is in search params), so the bundle resolves correctly at
# any depth. What a reviewer clicks is what gets promoted — which is the one thing #39 says the
# review app's previews cannot claim.
#
# Expiry is bucket-wide (infra/buckets.tf) — everything in that bucket is a preview, so there is no
# prefix to mis-target and a build that dies halfway still gets swept.
substitutions:
  _REGION: us-central1
  _FEATURES_SERVICE: ugs-warehouse-features
  _TILES_SERVICE: ugs-warehouse-tiles
  _PREVIEWS_BUCKET: ut-dnr-ugs-maps-prod-previews
  # Static, not resolved at build time: ugs-warehouse-previews lives in ut-dnr-ugs-maps-prod, a
  # DIFFERENT project from where this build runs (ut-dnr-ugs-backend-tools). A `gcloud run services
  # describe` here — like the same-project ones below for features/tiles — would need `--project`
  # AND cross-project run.viewer for the preview-build SA, just to print a URL. Not worth either:
  # the service's *.run.app URL is stable for its lifetime, so it's a substitution instead.
  _PREVIEWS_BASE_URL: https://ugs-warehouse-previews-ufyuidl4mq-uc.a.run.app
  _PREVIEW_PATH: viewer/pr-
  _REPO: UGS-GIO/ugs-warehouse

availableSecrets:
  secretManager:
    - versionName: projects/ut-dnr-ugs-backend-tools/secrets/ugs-warehouse-github-github-oauthtoken-86b32a/versions/latest
      env: GITHUB_TOKEN

steps:
  # Same service-URL resolution as the prod build, so the preview's endpoint links aren't dead.
  - id: resolve-service-urls
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_FEATURES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/features_url 2>/dev/null \
          || printf '' > /workspace/features_url
        gcloud run services describe ${_TILES_SERVICE} --region=${_REGION} \
          --format='value(status.url)' > /workspace/tiles_url 2>/dev/null \
          || printf '' > /workspace/tiles_url

  - id: build-viewer
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        export VITE_FEATURES_BASE="$$(cat /workspace/features_url 2>/dev/null || true)"
        export VITE_TILES_BASE="$$(cat /workspace/tiles_url 2>/dev/null || true)"
        cd viewer
        npm ci
        npm run build

  - id: deploy-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        DEST="gs://${_PREVIEWS_BUCKET}/${_PREVIEW_PATH}$_PR_NUMBER"
        gcloud storage rsync viewer/dist "$$DEST" \
          --recursive --delete-unmatched-destination-objects
        # Never cache preview HTML: a force-push has to be visible on reload.
        gcloud storage objects update "$$DEST/index.html" --cache-control="no-cache"
        echo "preview: ${_PREVIEWS_BASE_URL}/${_PREVIEW_PATH}$_PR_NUMBER/"

  # Cloud Build's own GitHub check only links back to the Cloud Build console — the previous
  # incarnation of this build made a reviewer dig through console logs to find the one thing they
  # actually need. Post the link where it's clickable: as a PR comment, upserted (not re-posted)
  # so a force-push updates the same comment instead of piling up new ones.
  #
  # A standalone script, not an inline heredoc: see scripts/post_preview_comment.py's docstring for
  # why embedding one in a YAML block-scalar bash step doesn't work.
  #
  # Non-fatal on purpose (the `|| true` at the end, on top of the script's own internal catch): a
  # comment failure must never fail a build that already deployed successfully — see #161/#162, the
  # exact failure mode this step exists to avoid repeating for itself.
  - id: comment-preview-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    secretEnv: ["GITHUB_TOKEN"]
    args:
      - -c
      - |
        REPO="${_REPO}" PR_NUMBER="$_PR_NUMBER" \
          PREVIEW_URL="${_PREVIEWS_BASE_URL}/${_PREVIEW_PATH}$_PR_NUMBER/" \
          python3 scripts/post_preview_comment.py || true

options:
  logging: CLOUD_LOGGING_ONLY
