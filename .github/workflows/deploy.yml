name: Deploy Warehouse

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Viewer-only changes deploy via viewer.yml; docs-only via docs.yml (both lighter, no image
    # builds). A mixed commit (backend + viewer/docs) still runs this full deploy.
    paths-ignore:
      - 'viewer/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'cloudbuild-docs.yaml'

# Single deployer: this only authenticates (WIF) + submits cloudbuild.yaml, which
# builds/pushes all images AND deploys job + harvest + service + api. No per-service
# deploy steps here — cloudbuild owns deploy, so the two never race.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/534590904912/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'warehouse-deployer@ut-dnr-ugs-backend-tools.iam.gserviceaccount.com'

      - uses: google-github-actions/setup-gcloud@v2

      # Sync (no --async): stream Cloud Build logs and block until it finishes, so this run
      # goes red if the build/deploy actually fails (not just on submit).
      - name: Build + deploy via Cloud Build
        run: |
          gcloud builds submit --config=cloudbuild.yaml . \
            --project=ut-dnr-ugs-backend-tools \
            --substitutions=_TAG=${GITHUB_SHA::7}
